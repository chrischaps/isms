name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: isms
          POSTGRES_PASSWORD: isms
          POSTGRES_DB: isms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U isms"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://isms:isms@localhost:5432/isms
      # sqlx compile-time queries read the committed .sqlx/ metadata (TDD 8, offline mode).
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # The debug target plus Playwright and the cache sit at the edge of the runner's disk
      # (S2.4 hit ENOSPC in the web e2e); drop the preinstalled toolchains nobody here uses.
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            agents/pnpm-lock.yaml
      - run: make check
      - name: Disk after the check
        run: df -h / | tail -1 && du -sh target 2>/dev/null || true
      - name: OpenAPI lint (S1.3)
        run: make openapi-lint
      - name: Core loop end to end (S1.6)
        run: make e2e
      - name: Scripted cohort against a lab society (S1.16)
        run: make e2e-agents
      - name: Playwright browsers
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Web end to end (S1.7)
        run: df -h / | tail -1 && make e2e-web
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results
          if-no-files-found: ignore
