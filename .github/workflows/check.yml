name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: isms
          POSTGRES_PASSWORD: isms
          POSTGRES_DB: isms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U isms"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://isms:isms@localhost:5432/isms
      # sqlx compile-time queries read the committed .sqlx/ metadata (TDD 8, offline mode).
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make check
      - name: OpenAPI lint (S1.3)
        run: make openapi-lint
