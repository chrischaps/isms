[workspace]
resolver = "3"
members = [
  "crates/isms-core",
  "crates/isms-sim",
  "crates/isms-store",
  "crates/isms-api-types",
  "crates/isms-server",
  "crates/isms-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# engine
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parsed f64s must equal the engine's bytes, or replay from JSONB diverges (S1.1).
serde_json = { version = "1", features = ["float_roundtrip"] }
postcard = { version = "1.1", features = ["use-std"] }
blake3 = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
libm = "0.2"
thiserror = "2"
toml = "0.9"
# sim
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
# store / server
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
metrics = "0.24"
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# tests
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
