[workspace]
resolver = "3"
members = [
  "crates/isms-core",
  "crates/isms-sim",
  "crates/isms-store",
  "crates/isms-api-types",
  "crates/isms-server",
  "crates/isms-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# engine
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
blake3 = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
libm = "0.2"
thiserror = "2"
toml = "0.9"
# sim
clap = { version = "4", features = ["derive"] }
csv = "1"
# tests
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
