# Synthetic players (S1.16). CLI flags override these; personas may override
# `models` for themselves in their frontmatter.

[models]
# Plays each hour's turn. `claude-haiku-4-5` is the cheap option, `claude-opus-5` the careful one.
turn = "claude-sonnet-5"
# Rewrites a player's notes and plan once a day.
cycle = "claude-opus-5"
# Where the daily rewrite runs: "api" (the SDK, on API credit) or "claude_code" (`claude -p` on the
# account's Claude subscription; the CLI must be installed and signed in). Turns always use the API.
cycle_provider = "claude_code"
# CLI reflections at once. Each `claude -p` is a whole Claude Code runtime; five at once froze the
# machine for twenty minutes on 2026-09-18. Turns go on with the old notes while a player reflects.
claude_code_concurrency = 1
# Effort for turn models with adaptive thinking (Sonnet 5, Opus 5): low | medium | high.
turn_effort = "low"
# Thinking budget for Haiku 4.5, which takes a token budget instead.
haiku_thinking_budget = 2048

[turn]
# Act tools per hour (reads are free); accepted or refused, each counts.
max_actions_per_turn = 4
max_tokens = 4096
# Players taking turns at once.
concurrency = 4
# A player still mid-turn when the next hour lands: skip that hour, or queue one turn.
overrun = "skip"

[budget]
# The run stops cleanly, and still writes its report, at either limit. Tokens count cache reads
# (a cached turn reads ~35k), so dollars are the real cap: the first live run spent $12.74 on 15M tokens.
max_tokens = 60_000_000
max_usd = 40

[run]
players = 8
# Poll /home this often when the WebSocket is down.
poll_ms = 3000
personas = ["founder", "wage-maximiser", "speculator", "saver", "slacker", "borrower", "landlord", "rule-prober"]
# A preset with its own list (S2.10): `pnpm play --preset commune` (run.sh passes PRESET through). Others fall back to `personas`.
personas_for = { commune = ["steward", "rationer", "free-rider", "chronicler", "steward", "rationer", "chronicler", "rule-prober"] }
# scripted (free, deterministic) | llm (every persona on a model) | mixed (each persona's own choice)
# | jev (the [jev] personas on TypeSafe's decision model, the rest scripted; SJ.1)
brain = "mixed"

[jev]
# TypeSafe's Jev through OpenRouter's Decisions API (SJ.1). Jev writes no text: code lays out each
# hour's choices with their quantities already worked out, Jev picks one per slot, code runs it.
# $0.042 per million input tokens, output free; a turn is a few hundred tokens, an epoch cents.
model = "~typesafe/jev-latest"
base_url = "https://openrouter.ai/api/alpha/decisions"
# With `brain = "jev"` these play on Jev; every other persona in the cast is scripted (the contrast).
personas = ["founder", "wage-maximiser", "speculator", "landlord"]
# A choice below this confidence is read as "do nothing". Jev's calibration is loose (an ECE of ~0.1
# in independent tests), so these floors do real work; tune them from the report's Jev section.
min_confidence = 0.35
# An irreversible choice (switch jobs, found a firm, buy a dwelling) needs this much, and 0.4 of the mass.
irreversible_confidence = 0.5
